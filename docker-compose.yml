services:
  api:
    image: python:3.10-slim
    working_dir: /workspace/services/api
    command: sh -c "pip install -e . && uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    environment:
      PROJECTS_ROOT: /workspace/projects
      DATABASE_PATH: /workspace/projects/research_agent.sqlite3
      LLM_MODE: mock

  web:
    image: node:22-alpine
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
