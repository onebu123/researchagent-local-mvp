name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      LLM_API_KEY: ""
      DATABASE_BACKEND: sqlite
      QUEUE_MODE: inline
      AUTH_MODE: disabled
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: python -m pip install -e services/api pytest
      - name: Compile Python
        run: python -m compileall services/api scripts
      - name: Test backend
        run: python -m pytest services/api/tests -q
      - name: Local eval smoke
        run: python scripts/evaluate_local_researchagent.py --output /tmp/researchagent_local_eval.json
      - name: Validate v38 release contract
        run: python scripts/validate_v38.py

  frontend:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend for Playwright webServer
        run: python -m pip install -e services/api
      - name: Install frontend
        working-directory: apps/web
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test --project=chromium

  release-readiness:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      LLM_API_KEY: ""
      DATABASE_BACKEND: sqlite
      QUEUE_MODE: inline
      AUTH_MODE: disabled
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: python -m pip install -e services/api pytest
      - name: Validate v38 release contract
        run: python scripts/validate_v38.py
      - name: Auto Scientist demo smoke
        run: >-
          python scripts/run_auto_scientist_demo.py
          --project-id ci_auto_scientist_v38
          --max-ideas 1
          --max-experiments-per-idea 1
          --generated-code
          --tree-search
          --output /tmp/researchagent_auto_scientist_demo.json
      - name: Validate v38 demo report
        run: >-
          python scripts/validate_v38.py
          --demo-report /tmp/researchagent_auto_scientist_demo.json
          --output /tmp/researchagent_validate_v38.json
      - name: Package release candidate
        run: python scripts/package_release.py --version v3.0.0-rc1 --output-dir /tmp/researchagent_dist

  security-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static secret scan
        run: python scripts/check_secrets_static.py
